name: Python package

on: [push, pull_request]

jobs:
  django:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
        django:
          - "==4.2.*"
          - "==5.1.*"
          - "==5.2.*"
    steps:
    - uses: actions/checkout@v4
    - name: Build application
      run: make build
      env:
        PYTHON_VERSION: ${{ matrix.python }}
        DJANGO_VERSION: ${{ matrix.django }}
    - name: Lint
      run: make lint
    - name: Migration check
      run: make check
    - name: Show settings
      run: make settings

    - name: Build test
      run: make test
    - name: Build package
      run: make build_pkg

    - uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: dist

  docs:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build application
      run: make build
    - name: Build documentation
      run: make docs